name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src/vulnscan/contracts
        continue-on-error: true

      - name: Run contract tests
        run: python -m pytest tests/contracts/ -q

      - name: Run platform tests
        run: python -m pytest tests/platform/ -q
        continue-on-error: true

      - name: Run analysis tests
        run: python -m pytest tests/analysis/ -q
        continue-on-error: true

      - name: Run sandbox tests
        run: python -m pytest tests/sandbox/ -q
        continue-on-error: true
