name: Required checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    outputs:
      distributions:
        description: Distribution artifact from the successful package job
        value: ${{ jobs.package.outputs.distributions }}
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  UV_VERSION: '0.12.17'
  UV_PYTHON_DOWNLOADS: never
  UV_NO_PROGRESS: '1'
  PYTHONUTF8: '1'
  DEVSECOPS_NATIVE: python
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --extra dev
      - name: Verify all shipped dependency exports
        run: uv run --no-sync python ci/check_lock_exports.py
      - run: uv run --no-sync python -m ruff check src tests ci
      - run: uv run --no-sync python -m ruff format --check src tests ci
      - name: Check types for supported platforms
        run: |
          uv run --no-sync python -m mypy --platform linux src/vulnscan
          uv run --no-sync python -m mypy --platform darwin src/vulnscan
          uv run --no-sync python -m mypy --platform win32 src/vulnscan
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --extra dev
      - name: Test gates, redaction, confinement, triage and fix verification with fakes
        run: uv run --no-sync python -m pytest tests/harness -q --junitxml=harness-junit.xml --cov=vulnscan.harness --cov-report=xml:harness-coverage.xml --cov-report=term-missing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harness-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            harness-junit.xml
            harness-coverage.xml
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --extra dev --extra scanners
      - run: go vet ./...
      - run: go test ./...
      - run: uv run --no-sync python ci/build_native.py
      - name: Test the built native binary, CLI and bridge
        run: uv run --no-sync python -m pytest tests/platform tests/cli -q --junitxml=native-junit.xml --cov=vulnscan --cov-report=xml:native-coverage.xml --cov-report=term-missing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            native-junit.xml
            native-coverage.xml
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.11'}
          - {os: macos-latest, python: '3.11'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --extra dev --extra scanners
      - name: Run every Python test area
        run: uv run --no-sync python -m pytest tests -q --junitxml=junit.xml --cov=vulnscan --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_attempt }}
          path: |
            junit.xml
            coverage.xml
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      distributions: ${{ steps.bundle.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --extra dev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Build once, verify the installed wheel and cross-compile release binaries
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          uv run --no-sync python ci/package_smoke.py
          uv run --no-sync python ci/build_native.py --all --out dist
      - id: bundle
        run: echo "name=release-distributions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: dist/*
          if-no-files-found: error
  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Create a clean fixture checkout
        run: |
          cp -r tests/fixtures/java/safe "$RUNNER_TEMP/safe"
          git -C "$RUNNER_TEMP/safe" init
          git -C "$RUNNER_TEMP/safe" add .
          git -C "$RUNNER_TEMP/safe" -c user.name=Fixture -c user.email=fixture@example.invalid commit -m fixture
      - uses: ./
        with:
          checkout-path: ${{ runner.temp }}/safe
      - name: Verify both real baseline fixture outcomes
        env:
          SCAN_INTEGRATION_OUTPUT: ${{ runner.temp }}/fast-baseline-evidence
        run: python ci/fixture_scan.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fast-baseline-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fast-baseline-evidence
  web-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  required:
    name: CI required
    if: always()
    needs: [quality, harness, web-ui, native, tests, package, action-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Require every prerequisite job to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python ci/require_success.py
