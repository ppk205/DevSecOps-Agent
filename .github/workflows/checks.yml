name: Required checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    outputs:
      distributions:
        description: Distribution artifact from the successful package job
        value: ${{ jobs.package.outputs.distributions }}
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src tests ci
      - run: uv run --frozen ruff format --check src tests ci
      - run: uv run --frozen mypy src/vulnscan
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.11'}
          - {os: macos-latest, python: '3.11'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.17
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest --junitxml=junit.xml --cov=vulnscan --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_attempt }}
          path: |
            junit.xml
            coverage.xml
  package:
    runs-on: ubuntu-latest
    outputs:
      distributions: ${{ steps.bundle.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --frozen --extra dev
      - shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          uv run --frozen python ci/package_smoke.py
      - id: bundle
        shell: bash
        run: echo "name=release-distributions-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: dist/*
          if-no-files-found: error
  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Create a clean fixture checkout
        run: |
          cp -r tests/fixtures/java/safe "$RUNNER_TEMP/safe"
          git -C "$RUNNER_TEMP/safe" init
          git -C "$RUNNER_TEMP/safe" add .
          git -C "$RUNNER_TEMP/safe" -c user.name=Fixture -c user.email=fixture@example.invalid commit -m fixture
      - uses: ./
        with:
          checkout-path: ${{ runner.temp }}/safe
      - run: python ci/fixture_scan.py
