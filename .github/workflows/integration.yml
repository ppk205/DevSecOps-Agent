name: Extended integration
on:
  schedule:
    - cron: '15 2 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONUTF8: '1'
  DEVSECOPS_NATIVE: python
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
jobs:
  full-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install the locked baseline tools and verify installed chat refusal
        run: python ci/install_action.py
      - name: Build the contained baseline scanner image
        run: python ci/build_image.py
      - name: Check safe and vulnerable fixtures with full baseline scanners
        run: python ci/fixture_scan.py --full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: full-profile-evidence-${{ github.run_attempt }}
          path: |
            artifacts/integration
            !artifacts/integration/.scanner-data/**
          if-no-files-found: warn
