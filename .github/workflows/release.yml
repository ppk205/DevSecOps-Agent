name: GitHub release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version X.Y.Z already merged to main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-release
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - id: freeze
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python ci/release.py freeze
  checks:
    needs: freeze
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.freeze.outputs.sha }}
  integration:
    needs: freeze
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ needs.freeze.outputs.sha }}
  publish:
    needs: [freeze, checks, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.freeze.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.checks.outputs.distributions }}
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.freeze.outputs.sha }}
        run: python ci/release.py publish
