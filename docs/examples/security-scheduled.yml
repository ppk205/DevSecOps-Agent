name: Full security scan
on:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Replace this placeholder with the full published commit SHA you reviewed.
      - uses: ppk205/DevSecOps-Agent@RELEASE_COMMIT_SHA
        with:
          profile: full
