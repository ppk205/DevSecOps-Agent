name: Full security scan
on:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ppk205/DevSecOps-Agent@v0.2.0
        with:
          profile: full
