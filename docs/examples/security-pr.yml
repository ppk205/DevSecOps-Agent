name: Security scan
on:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ppk205/DevSecOps-Agent@v0.2.0 # Or pin the release commit SHA
        id: security
        with:
          checkout-path: .
          profile: fast
          fail-on: high
