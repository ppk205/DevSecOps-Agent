name: Security scan
on:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Replace this placeholder with the full published commit SHA you reviewed.
      - uses: ppk205/DevSecOps-Agent@RELEASE_COMMIT_SHA
        id: security
        with:
          checkout-path: .
          profile: fast
          fail-on: high
