[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devsecops-agent"
version = "0.1.0"
description = "Automated vulnerability scanning and DevSecOps assessment agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "DevSecOps Agent Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-click>=8.1.0",
]
scanners = [
    "semgrep>=1.70.0",
]
browser = [
    "playwright>=1.45.0",
    "pytest-playwright>=0.5.0",
]
cvss = [
    "cvss>=3.0.0",
]
laya = [
    "laya==0.3.20",
]

[project.scripts]
devsecops-agent = "vulnscan.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
