[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "devsecops-agent"
version = "0.2.0"
description = "Automated vulnerability scanning and DevSecOps assessment agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "DevSecOps Agent Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "textual>=0.89,<2",
    "tzdata>=2024.1",
    "filelock>=3.16",
    "python-multipart>=0.0.18",
    "lxml>=5.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "hatchling==1.27.0",
    "build>=1.2",
    "types-lxml>=2024.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
scanners = [
    "semgrep==1.178.0",
]
browser = [
    "playwright>=1.45.0",
    "pytest-playwright>=0.5.0",
]
cvss = [
    "cvss>=3.0.0",
]
laya = [
    "laya==0.3.20",
]
training = [
    "laya==0.3.20",
    "transformers==5.17.0",
    "safetensors>=0.4,<1",
    "huggingface-hub>=1,<2",
]

[project.scripts]
devsecops-agent = "vulnscan.cli.main:main"
devsec = "vulnscan.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# A hung test otherwise only reports when the whole CI job is killed. This is
# a ceiling far above the slowest real test (semgrep rule runs take ~6s), not a
# performance budget: lower it with -o timeout= when bisecting.
timeout = 300

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.sdist]
only-include = ["src/vulnscan", "tests", "docs", "ci", "cmd", "internal", "go.mod", "go.sum", "notebooks", "pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md", "uv.lock", "requirements.lock", "requirements-build.lock", "requirements-scanners.lock", "action.yml"]

[dependency-groups]
build = ["hatchling==1.27.0"]
