# Project identity is supplied by the workflow from GitHub Actions variables.
sonar.projectName=DevSecOps-Agent
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Discover every supported first-party language, including workflow/config files.
# Test inclusions and source exclusions keep source and test sets disjoint.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**,**/*_test.go,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/*.spec.ts,**/*.spec.tsx,**/test-setup.ts
sonar.exclusions=\
  tests/**,**/*_test.go,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/*.spec.ts,**/*.spec.tsx,**/test-setup.ts,\
  **/node_modules/**,**/dist/**,**/build/**,**/target/**,**/coverage/**,**/__pycache__/**,\
  .git/**,.venv*/**,.tools/**,.devsec/**,.providers/**,.planning/**,.hermes/**,.scannerwork/**,\
  artifacts/**,evidence/**,essay/**,tests/fixtures/**,\
  .env,.env.*,.secrets,**/.env,**/.env.*,**/.secrets
sonar.test.exclusions=\
  **/node_modules/**,**/dist/**,**/build/**,**/target/**,**/coverage/**,**/__pycache__/**,\
  .git/**,.venv*/**,.tools/**,.devsec/**,.providers/**,.planning/**,.hermes/**,.scannerwork/**,\
  artifacts/**,evidence/**,essay/**,tests/fixtures/**,\
  .env,.env.*,.secrets,**/.env,**/.env.*,**/.secrets

# Make the GitHub check reflect the server's quality gate, not just upload success.
sonar.qualitygate.wait=true
