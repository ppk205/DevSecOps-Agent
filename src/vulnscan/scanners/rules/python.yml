rules:
  # ─── Injection ──────────────────────────────────────────────────────
  - id: py-sql-injection
    languages: [python]
    severity: ERROR
    message: SQL built with string formatting; use a parameterized query.
    metadata:
      cwe: ['CWE-89: SQL Injection']
      version: '0.2.0'
    pattern-either:
      - pattern: $C.execute("..." % ...)
      - pattern: $C.execute("..." + ...)
      - pattern: $C.execute("...".format(...))
      - pattern: $C.execute(f"...")

  - id: py-xss-markup-bypass
    languages: [python]
    severity: ERROR
    mode: taint
    message: Request data reaches Markup() without escaping; use escape().
    metadata:
      cwe: ['CWE-79: Cross-site Scripting (XSS)']
      version: '0.2.0'
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: request.get_json(...)
      - pattern: request.json
      - pattern: request.data
      - pattern: request.GET.get(...)
      - pattern: request.POST.get(...)
    pattern-sinks:
      - pattern: Markup(...)
      - pattern: markupsafe.Markup(...)
      - pattern: flask.Markup(...)
    pattern-sanitizers:
      - pattern: markupsafe.escape(...)
      - pattern: flask.escape(...)
      - pattern: html.escape(...)
      - pattern: escape(...)

  - id: py-command-injection
    languages: [python]
    severity: ERROR
    mode: taint
    message: Request data reaches a shell command; use an argument list or shlex.quote().
    metadata:
      cwe: ['CWE-78: OS Command Injection']
      version: '0.2.0'
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: request.get_json(...)
      - pattern: request.json
      - pattern: request.data
      - pattern: request.GET.get(...)
      - pattern: request.POST.get(...)
    pattern-sinks:
      - pattern: os.system(...)
      - pattern: os.popen(...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)
    pattern-sanitizers:
      - pattern: shlex.quote(...)

  - id: py-code-injection-eval
    languages: [python]
    severity: ERROR
    mode: taint
    message: Request data reaches eval()/exec(); never execute untrusted code.
    metadata:
      cwe: ['CWE-95: Eval Injection']
      version: '0.2.0'
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: request.get_json(...)
      - pattern: request.json
      - pattern: request.data
      - pattern: request.GET.get(...)
      - pattern: request.POST.get(...)
    pattern-sinks:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: py-path-traversal-open
    languages: [python]
    severity: ERROR
    mode: taint
    message: File path includes externally controlled input; validate or confine it.
    metadata:
      cwe: ['CWE-22: Path Traversal']
      version: '0.2.0'
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: request.get_json(...)
      - pattern: request.json
      - pattern: request.data
      - pattern: request.GET.get(...)
      - pattern: request.POST.get(...)
    pattern-sinks:
      - pattern: open(...)
    pattern-sanitizers:
      - pattern: os.path.basename(...)
      - pattern: werkzeug.utils.safe_join(...)
      - pattern: safe_join(...)

  - id: py-ssrf-requests
    languages: [python]
    severity: ERROR
    mode: taint
    message: Request data reaches an outbound HTTP call; restrict to an allowlist.
    metadata:
      cwe: ['CWE-918: Server-Side Request Forgery (SSRF)']
      version: '0.2.0'
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: request.get_json(...)
      - pattern: request.json
      - pattern: request.data
      - pattern: request.GET.get(...)
      - pattern: request.POST.get(...)
    pattern-sinks:
      - pattern: requests.get(...)
      - pattern: requests.post(...)
      - pattern: requests.put(...)
      - pattern: requests.delete(...)
      - pattern: requests.patch(...)
      - pattern: requests.head(...)
      - pattern: requests.request(...)
      - pattern: urllib.request.urlopen(...)

  # ─── Templates / Deserialization ────────────────────────────────────
  - id: py-ssti-jinja2
    languages: [python]
    severity: ERROR
    message: Rendering a template built from a string enables SSTI; use get_template().
    metadata:
      cwe: ['CWE-1336: Template Injection']
      version: '0.2.0'
    pattern-either:
      - pattern: jinja2.Template(...).render(...)
      - pattern: Template(...).render(...)
      - pattern: $ENV.from_string(...).render(...)

  - id: py-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Unsafe deserialization of untrusted data; use json or yaml.safe_load.
    metadata:
      cwe: ['CWE-502: Deserialization of Untrusted Data']
      version: '0.2.0'
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: marshal.loads(...)
          - pattern: marshal.load(...)
          - pattern: yaml.load(...)
          - pattern: shelve.open(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.BaseLoader, ...)

  # ─── Secrets / Randomness ───────────────────────────────────────────
  - id: py-hardcoded-secret
    languages: [python]
    severity: WARNING
    message: Hardcoded credential; load secrets from the environment or a vault.
    metadata:
      cwe: ['CWE-798: Use of Hard-coded Credentials']
      version: '0.2.0'
    pattern-regex: '(?i)(password|passwd|secret|api_key|apikey|access_token)\s*=\s*[''"][^''"]+[''"]'

  - id: py-weak-random-token
    languages: [python]
    severity: WARNING
    message: random is predictable in security contexts; use the secrets module.
    metadata:
      cwe: ['CWE-330: Use of Insufficiently Random Values']
      version: '0.2.0'
    pattern-either:
      - pattern: random.random()
      - pattern: random.randint(...)
      - pattern: random.randrange(...)
      - pattern: random.choice(...)
      - pattern: random.uniform(...)

  # ─── Injection: LDAP / XML / headers / redirects ────────────────────
  - id: py-ldap-injection
    languages: [python]
    severity: ERROR
    mode: taint
    message: Request data reaches an LDAP filter; escape it with escape_filter_chars().
    metadata:
      cwe: ['CWE-90: LDAP Injection']
      version: '0.3.0'
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: request.get_json(...)
      - pattern: request.json
      - pattern: request.data
      - pattern: request.GET.get(...)
      - pattern: request.POST.get(...)
    pattern-sinks:
      - pattern: $CONN.search(...)
      - pattern: $CONN.search_s(...)
      - pattern: $CONN.search_st(...)
    pattern-sanitizers:
      - pattern: ldap.filter.escape_filter_chars(...)
      - pattern: escape_filter_chars(...)

  - id: py-xxe-xml-parser
    languages: [python]
    severity: ERROR
    message: XML parser resolves external entities; use defusedxml or disable them.
    metadata:
      cwe: ['CWE-611: XML External Entity (XXE)']
      version: '0.3.0'
    pattern-either:
      - pattern: lxml.etree.fromstring(...)
      - pattern: lxml.etree.XML(...)
      - pattern: lxml.etree.parse(...)
      - pattern: xml.etree.ElementTree.fromstring(...)
      - pattern: xml.etree.ElementTree.parse(...)
      - pattern: etree.fromstring(...)
      - pattern: etree.XML(...)
      - pattern: etree.parse(...)
      - pattern: ET.fromstring(...)
      - pattern: ET.parse(...)
      - pattern: ElementTree.fromstring(...)
      - pattern: ElementTree.parse(...)

  - id: py-header-injection
    languages: [python]
    severity: ERROR
    mode: taint
    message: Request data reaches a response header; strip CR/LF or allowlist values.
    metadata:
      cwe: ['CWE-113: HTTP Response Splitting']
      version: '0.3.0'
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: request.get_json(...)
      - pattern: request.json
      - pattern: request.data
      - pattern: request.GET.get(...)
      - pattern: request.POST.get(...)
    pattern-sinks:
      - pattern: $RESP.headers[...] = ...
      - pattern: $RESP.headers.set(...)
      - pattern: $RESP.headers.append(...)

  - id: py-open-redirect
    languages: [python]
    severity: ERROR
    mode: taint
    message: Request data reaches a redirect target; validate against an allowlist.
    metadata:
      cwe: ['CWE-601: Open Redirect']
      version: '0.3.0'
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: request.get_json(...)
      - pattern: request.json
      - pattern: request.data
      - pattern: request.GET.get(...)
      - pattern: request.POST.get(...)
    pattern-sinks:
      - pattern: redirect(...)
      - pattern: flask.redirect(...)
      - pattern: HttpResponseRedirect(...)
      - pattern: HttpResponsePermanentRedirect(...)
      - pattern: django.shortcuts.redirect(...)
    pattern-sanitizers:
      - pattern: flask.url_for(...)
      - pattern: url_for(...)

  # ─── Cryptography / auth ────────────────────────────────────────────
  - id: py-weak-hash
    languages: [python]
    severity: WARNING
    message: md5/sha1 are broken for security use; prefer sha256 or bcrypt.
    metadata:
      cwe: ['CWE-328: Use of Weak Hash']
      version: '0.3.0'
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
      - pattern: hashlib.sha(...)

  - id: py-jwt-hardcoded-secret
    languages: [python]
    severity: ERROR
    message: JWT signed with a hardcoded secret; load the key from the environment.
    metadata:
      cwe: ['CWE-798: Use of Hard-coded Credentials']
      version: '0.3.0'
    pattern-either:
      - pattern: jwt.encode(..., "...", ...)
      - pattern: jwt.encode(..., key="...", ...)
      - pattern: jwt.decode(..., "...", ...)

  # ─── Deserialization variants ───────────────────────────────────────
  - id: py-pickle-variant-loads
    languages: [python]
    severity: ERROR
    message: Unsafe deserialization via dill/cloudpickle/joblib; use json instead.
    metadata:
      cwe: ['CWE-502: Deserialization of Untrusted Data']
      version: '0.3.0'
    pattern-either:
      - pattern: dill.loads(...)
      - pattern: dill.load(...)
      - pattern: cloudpickle.loads(...)
      - pattern: cloudpickle.load(...)
      - pattern: joblib.load(...)
      - pattern: cPickle.loads(...)
      - pattern: cPickle.load(...)
      - pattern: _pickle.loads(...)
      - pattern: _pickle.load(...)

  # ─── Configuration / transport ──────────────────────────────────────
  - id: py-debug-mode-enabled
    languages: [python]
    severity: WARNING
    message: Debug mode leaks tracebacks; never enable it in production.
    metadata:
      cwe: ['CWE-215: Debug Information Exposure']
      version: '0.3.0'
    pattern-either:
      - pattern: app.run(..., debug=True, ...)
      - pattern: app.debug = True
      - pattern: DEBUG = True

  - id: py-subprocess-shell-true
    languages: [python]
    severity: WARNING
    message: shell=True hands parsing to the shell; use an argument list instead.
    metadata:
      cwe: ['CWE-78: OS Command Injection']
      version: '0.3.0'
    pattern-either:
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)
      - pattern: subprocess.check_call(..., shell=True, ...)

  - id: py-tls-verify-disabled
    languages: [python]
    severity: ERROR
    message: TLS verification is disabled; keep verify=True or a pinned CA bundle.
    metadata:
      cwe: ['CWE-295: Improper Certificate Validation']
      version: '0.3.0'
    pattern-either:
      - pattern: requests.get(..., verify=False, ...)
      - pattern: requests.post(..., verify=False, ...)
      - pattern: requests.put(..., verify=False, ...)
      - pattern: requests.delete(..., verify=False, ...)
      - pattern: requests.request(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
