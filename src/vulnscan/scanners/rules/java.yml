rules:
  # ─── Injection ──────────────────────────────────────────────────────
  - id: java-sql-concatenation
    languages: [java]
    severity: ERROR
    message: SQL constructed through concatenation; use a parameterized query.
    metadata:
      cwe: ['CWE-89: SQL Injection']
      version: '0.2.0'
    pattern-either:
      - pattern: $S.executeQuery($A + $B)
      - pattern: $S.executeUpdate($A + $B)
      - pattern: $S.execute($A + $B)
      - pattern: $S.executeQuery("..." + $A)
      - pattern: $S.executeUpdate("..." + $A)

  - id: java-xss-response-writer
    languages: [java]
    severity: ERROR
    mode: taint
    message: Request data reaches an HTTP response without escaping; use a safe encoder.
    metadata:
      cwe: ['CWE-79: Cross-site Scripting (Reflected XSS)']
      version: '0.2.0'
    # Taint mode, not a pattern match. A pattern on getWriter().write() alone
    # flagged every static JSON body on a real repo (15 of 20 hits), because
    # the sink exists in all of them; only the dataflow says whether it is
    # actually injectable.
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getQueryString()
      - pattern: $REQ.getCookies()
      - pattern: $REQ.getPathInfo()
      - pattern: $REQ.getReader()
      - pattern: $REQ.getInputStream()
    pattern-sinks:
      - pattern: $R.getWriter().write(...)
      - pattern: $R.getWriter().print(...)
      - pattern: $R.getWriter().println(...)
      - pattern: $R.getOutputStream().write(...)
      - pattern: $R.getOutputStream().print(...)
    pattern-sanitizers:
      - pattern: org.apache.commons.text.StringEscapeUtils.escapeHtml4(...)
      - pattern: org.apache.commons.lang3.StringEscapeUtils.escapeHtml4(...)
      - pattern: org.springframework.web.util.HtmlUtils.htmlEscape(...)
      - pattern: $S.encodeForHTML(...)
      - pattern: $S.escapeHtml4(...)
      - pattern: $S.htmlEscape(...)

  - id: java-path-traversal-file
    languages: [java]
    severity: ERROR
    message: File path includes externally controlled input; validate or canonicalize.
    metadata:
      cwe: ['CWE-22: Path Traversal']
      version: '0.2.0'
    pattern-either:
      - pattern: new java.io.File("..." + $X)
      - pattern: new java.io.FileInputStream("..." + $X)
      - pattern: new java.io.FileOutputStream("..." + $X)
      - pattern: new java.io.File($X + "...")

  - id: java-command-execution
    languages: [java]
    severity: ERROR
    message: Review command execution with externally controlled input.
    metadata:
      cwe: ['CWE-78: OS Command Injection']
      version: '0.2.0'
    pattern: Runtime.getRuntime().exec($CMD)

  - id: java-xxe-document-builder
    languages: [java]
    severity: ERROR
    message: DocumentBuilder without secure processing is vulnerable to XXE.
    metadata:
      cwe: ['CWE-611: XML External Entity Injection']
      version: '0.2.0'
    pattern-either:
      - pattern: javax.xml.parsers.DocumentBuilderFactory.newInstance().newDocumentBuilder()
      - pattern: javax.xml.transform.TransformerFactory.newInstance().newTransformer()
      - pattern: DocumentBuilderFactory.newInstance().newDocumentBuilder()
      - pattern: TransformerFactory.newInstance().newTransformer()

  # ─── Cryptography ──────────────────────────────────────────────────
  - id: java-weak-digest
    languages: [java]
    severity: WARNING
    message: Replace the weak digest with an appropriate modern algorithm.
    metadata:
      cwe: ['CWE-327: Broken Cryptographic Algorithm']
      version: '0.2.0'
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA-1")

  - id: java-weak-cipher
    languages: [java]
    severity: ERROR
    message: Replace the weak cipher with AES-256-GCM or equivalent.
    metadata:
      cwe: ['CWE-327: Broken Cryptographic Algorithm']
      version: '0.2.0'
    pattern-either:
      - pattern: javax.crypto.Cipher.getInstance("DES")
      - pattern: javax.crypto.Cipher.getInstance("3DES")
      - pattern: javax.crypto.Cipher.getInstance("DESede")
      - pattern: javax.crypto.Cipher.getInstance("Blowfish")
      - pattern: Cipher.getInstance("DES")
      - pattern: Cipher.getInstance("3DES")
      - pattern: Cipher.getInstance("DESede")
      - pattern: Cipher.getInstance("Blowfish")

  - id: java-weak-cipher-secret-key
    languages: [java]
    severity: WARNING
    message: Secret key uses a legacy algorithm; switch to AES-256.
    metadata:
      cwe: ['CWE-327: Broken Cryptographic Algorithm']
      version: '0.2.0'
    pattern-either:
      - pattern: new javax.crypto.spec.SecretKeySpec($X, "DES")
      - pattern: new javax.crypto.spec.SecretKeySpec($X, "3DES")
      - pattern: new javax.crypto.spec.SecretKeySpec($X, "DESede")

  # ─── Deserialization / SSRF ───────────────────────────────────────
  - id: java-unsafe-deserialization
    languages: [java]
    severity: ERROR
    message: ObjectInputStream.readObject enables deserialization attacks; use safe data formats.
    metadata:
      cwe: ['CWE-502: Deserialization of Untrusted Data']
      version: '0.2.0'
    pattern-either:
      - pattern: $IN.readObject()
      - pattern: $OIS.readObject()

  - id: java-unsafe-deserialization-objectmapper
    languages: [java]
    severity: WARNING
    message: ObjectMapper default typing allows polymorphic deserialization exploits.
    metadata:
      cwe: ['CWE-502: Deserialization of Untrusted Data']
      version: '0.2.0'
    pattern-either:
      - pattern: $MAPPER.enableDefaultTyping()
      - pattern: $MAPPER.enableDefaultTyping($POLYMORPHIC)
      - pattern: $MAPPER.activateDefaultTyping($TL)

  # ─── Randomness / TLS / AuthZ ─────────────────────────────────────
  - id: java-insecure-random
    languages: [java]
    severity: WARNING
    message: java.util.Random is predictable in security contexts; use SecureRandom.
    metadata:
      cwe: ['CWE-330: Use of Insufficiently Random Values']
      version: '0.2.0'
    pattern-either:
      - pattern: new java.util.Random()
      - pattern: new java.util.Random($SEED)
      - pattern: java.lang.Math.random()

  - id: java-trust-all-certificates
    languages: [java]
    severity: ERROR
    message: Trusting all certificates disables TLS peer verification.
    metadata:
      cwe: ['CWE-295: Improper Certificate Validation']
      version: '0.2.1'
    pattern-either:
      - pattern: javax.net.ssl.HttpsURLConnection.setDefaultHostnameVerifier(($HOST, $SESSION) -> true)
      - pattern: (javax.net.ssl.HttpsURLConnection $CONN).setHostnameVerifier(($HOST, $SESSION) -> true)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  new javax.net.ssl.HostnameVerifier() { ... }
              - pattern-inside: |
                  class $CLASS implements javax.net.ssl.HostnameVerifier { ... }
          - pattern: |
              public boolean verify(...) { return true; }
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  new javax.net.ssl.X509TrustManager() { ... }
              - pattern-inside: |
                  class $CLASS implements javax.net.ssl.X509TrustManager { ... }
          - pattern-either:
              - pattern: |
                  public void checkServerTrusted(...) {}
              - pattern: |
                  public void checkServerTrusted(...) { return; }

  - id: java-permissive-cors
    languages: [java]
    severity: WARNING
    message: Wildcard CORS origin disables cross-origin protections.
    metadata:
      cwe: ['CWE-942: Permissive Cross-domain Policy']
      version: '0.2.0'
    pattern-either:
      - pattern: $R.addHeader("Access-Control-Allow-Origin", "*")
      - pattern: $R.setHeader("Access-Control-Allow-Origin", "*")

  # ─── Injection II: LDAP / XPath / SSRF / process / redirect / reflection ──
  - id: java-ldap-injection
    languages: [java]
    severity: ERROR
    mode: taint
    message: Request data reaches an LDAP search filter; use a parameterized filter or escape it.
    metadata:
      cwe: ['CWE-90: LDAP Injection']
      version: '0.3.0'
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getQueryString(...)
      - pattern: $REQ.getCookies(...)
      - pattern: $REQ.getPathInfo(...)
      - pattern: $REQ.getReader()
      - pattern: $REQ.getInputStream()
    pattern-sinks:
      - pattern: $CTX.search(...)
    pattern-sanitizers:
      - pattern: $F.encode()
      - pattern: org.springframework.ldap.support.LdapEncoder.filterEncode(...)

  - id: java-xpath-injection
    languages: [java]
    severity: ERROR
    mode: taint
    message: Request data reaches an XPath expression; use a parameterized XPathVariableResolver.
    metadata:
      cwe: ['CWE-643: XPath Injection']
      version: '0.3.0'
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getQueryString(...)
      - pattern: $REQ.getCookies(...)
      - pattern: $REQ.getPathInfo(...)
      - pattern: $REQ.getReader()
      - pattern: $REQ.getInputStream()
    pattern-sinks:
      - pattern: $XPATH.evaluate(...)
      - pattern: $XPATH.compile(...)

  - id: java-ssrf-url-connection
    languages: [java]
    severity: ERROR
    mode: taint
    message: Request data reaches an outbound URL connection; restrict to an allowlist.
    metadata:
      cwe: ['CWE-918: Server-Side Request Forgery (SSRF)']
      version: '0.3.0'
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getQueryString(...)
      - pattern: $REQ.getCookies(...)
      - pattern: $REQ.getPathInfo(...)
      - pattern: $REQ.getReader()
      - pattern: $REQ.getInputStream()
    pattern-sinks:
      - pattern: new java.net.URL(...).openConnection()
      - pattern: new URL(...).openConnection()
      - pattern: new java.net.URL(...).openStream()
      - pattern: new URL(...).openStream()

  - id: java-command-injection-processbuilder
    languages: [java]
    severity: ERROR
    mode: taint
    message: Request data reaches a process command; use a fixed argument list.
    metadata:
      cwe: ['CWE-78: OS Command Injection']
      version: '0.3.0'
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getQueryString(...)
      - pattern: $REQ.getCookies(...)
      - pattern: $REQ.getPathInfo(...)
      - pattern: $REQ.getReader()
      - pattern: $REQ.getInputStream()
    pattern-sinks:
      - pattern: new ProcessBuilder(...)
      - pattern: new java.lang.ProcessBuilder(...)
      - pattern: $PB.command(...)

  - id: java-open-redirect
    languages: [java]
    severity: WARNING
    mode: taint
    message: Request data controls a redirect target; validate against an allowlist.
    metadata:
      cwe: ['CWE-601: Open Redirect']
      version: '0.3.0'
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getQueryString(...)
      - pattern: $REQ.getCookies(...)
      - pattern: $REQ.getPathInfo(...)
      - pattern: $REQ.getReader()
      - pattern: $REQ.getInputStream()
    pattern-sinks:
      - pattern: $R.sendRedirect(...)

  - id: java-unsafe-reflection
    languages: [java]
    severity: ERROR
    mode: taint
    message: Request data selects a class or method reflectively; restrict to an allowlist.
    metadata:
      cwe: ['CWE-470: Externally-Controlled Input to Reflection']
      version: '0.3.0'
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getQueryString(...)
      - pattern: $REQ.getCookies(...)
      - pattern: $REQ.getPathInfo(...)
      - pattern: $REQ.getReader()
      - pattern: $REQ.getInputStream()
    pattern-sinks:
      - pattern: Class.forName(...)
      - pattern: java.lang.Class.forName(...)
      - pattern: $C.getMethod(...)
      - pattern: $C.getDeclaredMethod(...)

  - id: java-log-injection
    languages: [java]
    severity: WARNING
    mode: taint
    message: Request data reaches a log statement; neutralize CRLF sequences first.
    metadata:
      cwe: ['CWE-117: Log Injection']
      version: '0.3.0'
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getQueryString(...)
      - pattern: $REQ.getCookies(...)
      - pattern: $REQ.getPathInfo(...)
      - pattern: $REQ.getReader()
      - pattern: $REQ.getInputStream()
    pattern-sinks:
      - pattern: $LOG.trace(...)
      - pattern: $LOG.debug(...)
      - pattern: $LOG.info(...)
      - pattern: $LOG.warn(...)
      - pattern: $LOG.error(...)
      - pattern: $LOG.log(...)

  # ─── Hardening: cookies / secrets / errors / parsers / paths ─────────────
  - id: java-insecure-cookie
    languages: [java]
    severity: WARNING
    message: Cookie explicitly disables Secure or HttpOnly; set both flags.
    metadata:
      cwe: ['CWE-614: Sensitive Cookie Without Secure Flag']
      version: '0.3.0'
    pattern-either:
      - pattern: $C.setSecure(false)
      - pattern: $C.setHttpOnly(false)

  - id: java-hardcoded-credentials
    languages: [java]
    severity: WARNING
    message: Hardcoded credential; load secrets from the environment or a vault.
    metadata:
      cwe: ['CWE-798: Use of Hard-coded Credentials']
      version: '0.3.0'
    pattern-regex: '(?i)(password|passwd|secret|api[_-]?key|access[_-]?token)\s*=\s*"[^"]+"'

  - id: java-stack-trace-exposure
    languages: [java]
    severity: WARNING
    message: printStackTrace exposes internals; log through a logger instead.
    metadata:
      cwe: ['CWE-209: Information Exposure Through an Error Message']
      version: '0.3.0'
    pattern: $E.printStackTrace(...)

  - id: java-xxe-sax-parser
    languages: [java]
    severity: ERROR
    message: SAX parser without secure processing is vulnerable to XXE.
    metadata:
      cwe: ['CWE-611: XML External Entity Injection']
      version: '0.3.0'
    pattern-either:
      - pattern: javax.xml.parsers.SAXParserFactory.newInstance().newSAXParser()
      - pattern: SAXParserFactory.newInstance().newSAXParser()
      - pattern: org.xml.sax.helpers.XMLReaderFactory.createXMLReader()

  - id: java-path-traversal-nio
    languages: [java]
    severity: ERROR
    message: NIO path includes externally controlled input; validate or confine it.
    metadata:
      cwe: ['CWE-22: Path Traversal']
      version: '0.3.0'
    pattern-either:
      - pattern: java.nio.file.Paths.get("..." + $X)
      - pattern: java.nio.file.Paths.get($X + "...")
      - pattern: Paths.get("..." + $X)
      - pattern: Paths.get($X + "...")
