rules:
  # ─── Injection ──────────────────────────────────────────────────────
  - id: js-sql-concatenation
    languages: [javascript, typescript]
    severity: ERROR
    message: SQL built through concatenation or interpolation; use a parameterized query.
    metadata:
      cwe: ['CWE-89: SQL Injection']
      version: '0.2.0'
    pattern-either:
      - pattern: $DB.query($A + $B, ...)
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.execute($A + $B, ...)
      - pattern: $DB.execute(`...${$X}...`, ...)

  - id: js-xss-innerhtml
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: Request data reaches an HTML sink without escaping; encode output or sanitize with DOMPurify.
    metadata:
      cwe: ['CWE-79: Cross-site Scripting (XSS)']
      version: '0.2.0'
    # Taint mode, not a pattern match. A pattern on innerHTML alone
    # flagged every static banner on a real repo, because the sink
    # exists in all of them; only the dataflow says whether it is
    # actually injectable.
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: location.search
      - pattern: location.hash
      - pattern: document.URL
    pattern-sinks:
      - pattern: $EL.innerHTML = ...
      - pattern: $EL.outerHTML = ...
      - pattern: document.write(...)
      - pattern: document.writeln(...)
      - pattern: $EL.insertAdjacentHTML(...)
    pattern-sanitizers:
      - pattern: DOMPurify.sanitize(...)
      - pattern: encodeURIComponent(...)
      - pattern: encodeURI(...)

  - id: js-command-injection
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: Externally controlled input reaches a shell command; use execFile/spawn with an argument list.
    metadata:
      cwe: ['CWE-78: OS Command Injection']
      version: '0.2.0'
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: process.argv
    pattern-sinks:
      - pattern: $CP.exec(...)
      - pattern: $CP.execSync(...)

  - id: js-path-traversal
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: File path includes externally controlled input; validate or canonicalize.
    metadata:
      cwe: ['CWE-22: Path Traversal']
      version: '0.2.0'
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
    pattern-sinks:
      - pattern: $FS.readFile(...)
      - pattern: $FS.readFileSync(...)
      - pattern: $FS.createReadStream(...)
      - pattern: $FS.writeFile(...)
      - pattern: $FS.writeFileSync(...)
    pattern-sanitizers:
      - pattern: path.basename(...)
      - pattern: path.normalize(...)

  - id: js-ssrf-fetch
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: Request data reaches an outbound HTTP call; validate against an allowlist.
    metadata:
      cwe: ['CWE-918: Server-Side Request Forgery (SSRF)']
      version: '0.2.0'
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
    pattern-sinks:
      - pattern: fetch(...)
      - pattern: axios.get(...)
      - pattern: axios.post(...)
      - pattern: axios.request(...)
      - pattern: axios(...)
      - pattern: http.get(...)
      - pattern: https.get(...)
      - pattern: http.request(...)
      - pattern: https.request(...)
    pattern-sanitizers:
      - pattern: encodeURIComponent(...)

  - id: js-open-redirect
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: Request data reaches a redirect target; validate against an allowlist.
    metadata:
      cwe: ['CWE-601: Open Redirect']
      version: '0.2.0'
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
    pattern-sinks:
      - pattern: $RES.redirect(...)
      - pattern: location.assign(...)
    pattern-sanitizers:
      - pattern: encodeURIComponent(...)

  - id: js-eval-injection
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: Request data reaches dynamic code execution; avoid eval/Function with untrusted input.
    metadata:
      cwe: ['CWE-95: Code Injection']
      version: '0.2.0'
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
    pattern-sinks:
      - pattern: eval(...)
      - pattern: new Function(...)

  # ─── Randomness / Secrets / Objects ────────────────────────────────
  - id: js-insecure-random
    languages: [javascript, typescript]
    severity: WARNING
    message: Math.random is predictable in security contexts; use crypto.randomBytes/getRandomValues.
    metadata:
      cwe: ['CWE-330: Use of Insufficiently Random Values']
      version: '0.2.0'
    pattern: Math.random()

  - id: js-hardcoded-secret
    languages: [javascript, typescript]
    severity: WARNING
    message: Hardcoded credential in source; load secrets from the environment or a vault.
    metadata:
      cwe: ['CWE-798: Hardcoded Credentials']
      version: '0.2.0'
    pattern-regex: (?i)(password|passwd|secret|api[_-]?key|token)\s*=\s*['"][^'"]+['"]

  - id: js-prototype-pollution
    languages: [javascript, typescript]
    severity: WARNING
    mode: taint
    message: Untrusted data reaches a recursive merge; validate keys or freeze the prototype.
    metadata:
      cwe: ['CWE-1321: Prototype Pollution']
      version: '0.2.0'
    pattern-sources:
      - pattern: req.body
      - pattern: req.query
      - pattern: JSON.parse(...)
    pattern-sinks:
      - pattern: $X.merge(...)
      - pattern: $X.mergeWith(...)
      - pattern: $X.defaultsDeep(...)

  # ─── Eval variants / Injection ────────────────────────────────────
  - id: js-redos-dynamic-regexp
    languages: [javascript, typescript]
    severity: WARNING
    mode: taint
    message: Request data builds a regular expression; anchor the pattern or escape it first.
    metadata:
      cwe: ['CWE-1333: Inefficient Regular Expression Complexity']
      version: '0.2.0'
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
    pattern-sinks:
      - pattern: new RegExp(...)
      - pattern: RegExp(...)
    pattern-sanitizers:
      - pattern: _.escapeRegExp(...)

  - id: js-implied-eval
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: Request data reaches a string-evaluated callback or vm API; pass a function reference instead.
    metadata:
      cwe: ['CWE-95: Code Injection']
      version: '0.2.0'
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
    pattern-sinks:
      - pattern: setTimeout(...)
      - pattern: setInterval(...)
      - pattern: vm.runInThisContext(...)
      - pattern: vm.runInNewContext(...)
      - pattern: vm.runInContext(...)
      - pattern: vm.compileFunction(...)

  - id: js-shell-spawn
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: 'Externally controlled input reaches a shell-enabled spawn; drop shell:true or allowlist the command.'
    metadata:
      cwe: ['CWE-78: OS Command Injection']
      version: '0.2.0'
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: process.argv
    pattern-sinks:
      - pattern: '$CP.spawn(..., {shell: true, ...}, ...)'
      - pattern: '$CP.spawnSync(..., {shell: true, ...}, ...)'
      - pattern: '$CP.execFile(..., {shell: true, ...}, ...)'

  - id: js-nosql-injection
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: Request data reaches a NoSQL query operator; cast to a primitive or sanitize the filter.
    metadata:
      cwe: ['CWE-943: NoSQL Injection']
      version: '0.2.0'
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
    pattern-sinks:
      - pattern: $DB.find(...)
      - pattern: $DB.findOne(...)
      - pattern: $DB.findOneAndUpdate(...)
      - pattern: $DB.updateOne(...)
      - pattern: $DB.updateMany(...)
      - pattern: $DB.deleteOne(...)
      - pattern: $DB.deleteMany(...)
    pattern-sanitizers:
      - pattern: String(...)
      - pattern: Number(...)
      - pattern: validator.escape(...)

  # ─── Auth / Browser / Hygiene ─────────────────────────────────────
  - id: js-jwt-weak-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: JWT signed with an empty or weak literal secret or none algorithm; use a strong env secret.
    metadata:
      cwe: ['CWE-327: Broken or Risky Cryptographic Algorithm']
      version: '0.2.0'
    pattern-either:
      - pattern: $JWT.sign($P, "", ...)
      - pattern: $JWT.sign($P, "secret", ...)
      - pattern: $JWT.sign($P, "password", ...)
      - pattern: $JWT.sign($P, "changeme", ...)
      - pattern: '$JWT.sign(..., {algorithm: "none", ...}, ...)'

  - id: js-postmessage-wildcard
    languages: [javascript, typescript]
    severity: WARNING
    message: postMessage targets any origin; pin the recipient origin explicitly.
    metadata:
      cwe: ['CWE-940: Improper Verification of Source of a Communication Channel']
      version: '0.2.0'
    pattern: $WIN.postMessage($MSG, "*")

  - id: js-timing-unsafe-compare
    languages: [javascript, typescript]
    severity: WARNING
    mode: taint
    message: Secret compared with equality leaks timing information; use crypto.timingSafeEqual.
    metadata:
      cwe: ['CWE-208: Observable Timing Discrepancy']
      version: '0.2.0'
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
    pattern-sinks:
      - pattern: $A == $B
      - pattern: $A === $B
    pattern-sanitizers:
      - pattern: crypto.timingSafeEqual(...)

  - id: js-debug-leftover
    languages: [javascript, typescript]
    severity: WARNING
    message: Leftover debugger or console call ships debug output; remove it before release.
    metadata:
      cwe: ['CWE-489: Active Debug Code']
      version: '0.2.0'
    pattern-either:
      - pattern: debugger;
      - pattern: console.log(...)
      - pattern: console.debug(...)

  - id: js-weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: MD5, SHA-1 and createCipher are broken for security use; use SHA-256 or createCipheriv.
    metadata:
      cwe: ['CWE-328: Use of Weak Hash']
      version: '0.2.0'
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")
      - pattern: crypto.createCipher(...)

  - id: js-cors-wildcard
    languages: [javascript, typescript]
    severity: WARNING
    message: CORS allows any origin; restrict to an explicit allowlist.
    metadata:
      cwe: ['CWE-942: Permissive Cross-domain Policy']
      version: '0.2.0'
    pattern-either:
      - pattern: $RES.setHeader("Access-Control-Allow-Origin", "*")
      - pattern: $RES.header("Access-Control-Allow-Origin", "*")
      - pattern: cors()
