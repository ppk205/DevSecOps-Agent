<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}DevSecOps Agent{% endblock %}</title>
  <style>
    :root{
      --primary:#1c69d4;--primary-active:#0653b6;--primary-disabled:#d6d6d6;
      --ink:#262626;--body:#3c3c3c;--body-strong:#1a1a1a;--muted:#6b6b6b;--muted-soft:#9a9a9a;
      --hairline:#e6e6e6;--hairline-strong:#cccccc;
      --canvas:#ffffff;--surface-soft:#f7f7f7;--surface-card:#fafafa;--surface-strong:#ebebeb;
      --surface-dark:#1a2129;--surface-dark-elevated:#262e38;
      --on-primary:#ffffff;--on-dark:#ffffff;--on-dark-soft:#bbbbbb;
      --success:#22c55e;--warning:#f59e0b;--error:#dc2626;
      --font:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--canvas);color:var(--body);font-family:var(--font);font-size:16px;font-weight:300;line-height:1.55}
    .topnav{background:var(--canvas);border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:50}
    .topnav-inner{max-width:1440px;margin:0 auto;height:64px;display:flex;align-items:center;gap:32px;padding:0 24px}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
    .brand-mark{width:32px;height:32px;border-radius:9999px;background:var(--ink);color:var(--canvas);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
    .brand-name{font-size:15px;font-weight:700;letter-spacing:.02em}
    .topnav nav{display:flex;gap:24px;margin-left:16px}
    .topnav nav a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:400;letter-spacing:.3px;padding:8px 0}
    .topnav nav a.active{color:var(--primary);border-bottom:2px solid var(--primary)}
    .topnav nav a:hover{color:var(--primary)}
    main{max-width:1440px;margin:0 auto;padding:0 24px 80px}
    .hero{background:var(--surface-dark);color:var(--on-dark);padding:80px 24px;margin:0 -24px 80px}
    .hero-inner{max-width:1440px;margin:0 auto;padding:0 24px}
    .hero h1{font-size:64px;font-weight:700;line-height:1.05;margin:0 0 16px;color:var(--on-dark)}
    .hero p{font-size:16px;font-weight:300;color:var(--on-dark-soft);margin:0;max-width:720px}
    h1{font-size:48px;font-weight:700;line-height:1.1;color:var(--ink);margin:0 0 8px}
    h2{font-size:32px;font-weight:700;line-height:1.15;color:var(--ink);margin:0 0 16px}
    h3{font-size:24px;font-weight:700;color:var(--ink)}
    .muted{color:var(--muted)}
    .rule{height:3px;width:58px;background:var(--primary);margin:18px 0 28px}
    .button{display:inline-block;background:var(--primary);color:var(--on-primary);border:0;border-radius:0;padding:14px 32px;font-size:14px;font-weight:700;letter-spacing:.5px;text-decoration:none;cursor:pointer;line-height:1.2}
    .button:hover{background:var(--primary-active);color:var(--on-primary)}
    .button-secondary{display:inline-block;background:var(--canvas);color:var(--ink);border:1px solid var(--hairline-strong);border-radius:0;padding:13px 31px;font-size:14px;font-weight:700;letter-spacing:.5px;text-decoration:none;cursor:pointer}
    .button-secondary:hover{border-color:var(--ink)}
    .button[disabled]{background:var(--primary-disabled);color:var(--muted);cursor:default}
    button[type="submit"]{display:inline-block;background:var(--primary);color:var(--on-primary);border:0;border-radius:0;padding:14px 32px;height:48px;font-size:14px;font-weight:700;letter-spacing:.5px;cursor:pointer;font-family:var(--font)}
    button[type="submit"]:hover{background:var(--primary-active)}
    .text-link{background:none;border:0;color:var(--ink);font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;text-decoration:none;padding:0}
    .text-link:hover{color:var(--primary)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--canvas);margin:24px 0 80px;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
    .stat{padding:24px;border-left:1px solid var(--hairline)}
    .stat:first-child{border-left:0}
    .stat b{display:block;font-size:24px;font-weight:700;color:var(--ink);line-height:1.25}
    .stat span{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
    .panel{background:var(--canvas);border:1px solid var(--hairline);padding:24px;margin:0 0 24px}
    table{width:100%;border-collapse:collapse;background:var(--canvas)}
    th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--hairline);vertical-align:top}
    th{font-size:12px;font-weight:400;letter-spacing:.5px;color:var(--muted);text-transform:uppercase}
    code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    pre{overflow:auto;background:var(--surface-dark);color:var(--on-dark);padding:18px;line-height:1.5}
    label{display:block;font-weight:700;margin:14px 0 5px;font-size:16px;color:var(--ink)}
    input,select{width:100%;padding:14px 16px;border:1px solid var(--hairline-strong);border-radius:0;font:inherit;font-weight:300;height:48px;background:var(--canvas);color:var(--ink)}
    input:focus{outline:none;border:2px solid var(--ink);padding:13px 15px}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
    .chip{background:var(--canvas);border:1px solid var(--hairline-strong);color:var(--ink);border-radius:0;padding:8px 14px;font-size:12px;cursor:pointer}
    .chip.active{background:var(--ink);color:var(--on-dark);border-color:var(--ink)}
    .status{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.05em}
    .confirmed{color:#067647}.rejected{color:var(--muted)}.unresolved{color:var(--warning)}.unprocessed{color:var(--ink)}
    .stage-ok{color:#067647}.stage-run{color:var(--primary)}.stage-fail{color:var(--error)}.stage-idle{color:var(--muted-soft)}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;align-items:center}
    .dl-group{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--hairline-strong)}
    .dl-group a{padding:13px 18px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:700;letter-spacing:.5px;border-left:1px solid var(--hairline)}
    .dl-group a:first-child{border-left:0}
    .dl-group a:hover{background:var(--surface-soft);color:var(--primary)}
    .dl-label{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-right:4px}
    .pipeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--hairline)}
    .pipeline li{position:relative;padding:0 0 24px 28px}
    .pipeline li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:9999px;background:var(--muted-soft)}
    .pipeline li.ok::before{background:var(--success)}
    .pipeline li.run::before{background:var(--primary)}
    .pipeline li.fail::before{background:var(--error)}
    .pipeline .st-name{font-weight:700;color:var(--ink);font-size:16px}
    .pipeline .st-msg{color:var(--muted);font-size:14px}
    footer{background:var(--surface-soft);color:var(--body);padding:64px 24px;margin-top:80px}
    .footer-inner{max-width:1440px;margin:0 auto;display:flex;gap:48px;flex-wrap:wrap}
    .footer-inner div{min-width:180px}
    .footer-inner h4{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);margin:0 0 12px}
    .footer-inner a{display:block;color:var(--body);text-decoration:none;font-size:14px;margin:6px 0}
    .legal{max-width:1440px;margin:32px auto 0;color:var(--muted);font-size:14px}
    .live-dot{display:inline-block;width:10px;height:10px;border-radius:9999px;background:var(--success);margin-right:8px;animation:pulse 1.6s infinite}
    .live-dot.done{animation:none}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @media(max-width:1024px){.stats{grid-template-columns:1fr 1fr}.hero h1{font-size:40px}h1{font-size:32px}}
    @media(max-width:700px){.topnav nav{display:none}.hero{padding:48px 24px;margin-bottom:48px}}
  </style>
</head>
<body>
<div class="topnav"><div class="topnav-inner">
  <a class="brand" href="/"><span class="brand-mark">DS</span><span class="brand-name">DEVSECOPS&nbsp;AGENT</span></a>
  <nav>
    <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Targets</a>
    {% if run %}<a href="/runs/{{ run.id }}" class="{% if request.url.path == '/runs/' ~ run.id %}active{% endif %}">Run {{ run.id }}</a><a href="/runs/{{ run.id }}/findings">Findings</a>{% endif %}
  </nav>
</div></div>
<main>{% block content %}{% endblock %}</main>
<footer><div class="footer-inner">
  <div><h4>Scans</h4><a href="/">Targets</a></div>
  <div><h4>Reports</h4><a href="/">SARIF</a><a href="/">HTML</a><a href="/">Word</a></div>
  <div><h4>About</h4><a href="/">Deterministic evidence first</a></div>
</div><div class="legal">DevSecOps Agent · evidence-first security scanning · UI language: English</div></footer>
{% block scripts %}{% endblock %}
</body>
</html>
